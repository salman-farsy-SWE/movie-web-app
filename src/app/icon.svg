<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726"/>
      <stop offset="50%" stop-color="#0E101B"/>
      <stop offset="100%" stop-color="#06080E"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D61" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3A48C3" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Trails Red Gradient -->
    <linearGradient id="trailRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF596B"/>
      <stop offset="40%" stop-color="#E85355"/>
      <stop offset="100%" stop-color="#B81824"/>
    </linearGradient>

    <!-- Trails Blue Gradient -->
    <linearGradient id="trailBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BB8FF"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1D2599"/>
    </linearGradient>

    <!-- Play Arrow Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E1ECFF"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E85355" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Plate (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="7" opacity="0.8"/>

  <!-- Backlight Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#centerGlow)"/>

  <!-- Main Brand Icon Emblem -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    
    <!-- Left Ribbon of the M (Movie Trails Red) -->
    <path d="M 100 376 L 100 164 C 100 144 116 128 136 128 C 148 128 159 134 166 144 L 246 256 C 251 263 261 263 266 256 L 278 238 L 222 160 C 215 150 204 144 192 144 C 172 144 156 160 156 180 L 156 376 C 156 390 144 400 130 400 C 114 400 100 390 100 376 Z" 
          fill="none"/>

    <!-- Bold, Clean Cinema 'M' Ribbon -->
    <!-- Red Left Wing -->
    <path d="M 106 372 L 106 166 C 106 147 121 132 140 132 C 152 132 163 138 170 148 L 256 264 L 220 312 L 158 226 L 158 372 C 158 385 147 396 132 396 C 118 396 106 385 106 372 Z" 
          fill="url(#trailRed)"/>

    <!-- Blue Right Wing -->
    <path d="M 406 372 L 406 166 C 406 147 391 132 372 132 C 360 132 349 138 342 148 L 256 264 L 292 312 L 354 226 L 354 372 C 354 385 365 396 380 396 C 394 396 406 385 406 372 Z" 
          fill="url(#trailBlue)"/>

    <!-- Center Cinema Play Triangle -->
    <path d="M 234 212 C 234 202 245 196 254 201 L 308 239 C 316 244 316 256 308 261 L 254 299 C 245 304 234 298 234 288 Z" 
          fill="url(#playGrad)"/>
    <path d="M 234 212 C 234 202 245 196 254 201 L 308 239 C 316 244 316 256 308 261 L 254 299 C 245 304 234 298 234 288 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

    <!-- Film strip perforations subtle accents -->
    <circle cx="132" cy="180" r="8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="132" cy="240" r="8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="132" cy="300" r="8" fill="#FFFFFF" opacity="0.85"/>
    
    <circle cx="380" cy="180" r="8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="380" cy="240" r="8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="380" cy="300" r="8" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
